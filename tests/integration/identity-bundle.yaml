bundle: kubernetes
name: identity-platform
description: |
  The Canonical Identity Platform is a composable identity broker and identity provider based on open source products.
docs: https://discourse.charmhub.io/t/canonical-identity-platform/11825
website: https://github.com/canonical/iam-bundle
issues: https://github.com/canonical/iam-bundle/issues
applications:
  hydra:
    charm: hydra
    revision: 401
    resources:
      oci-image: 281
    channel: latest/edge
    scale: 1
    series: jammy
    trust: true
    options:
      dev: true
  kratos:
    charm: kratos
    revision: 571
    resources:
      oci-image: 433
    channel: latest/edge
    scale: 1
    series: jammy
    trust: true
    options:
      enforce_mfa: false
  kratos-external-idp-integrator:
    charm: kratos-external-idp-integrator
    channel: latest/edge
    revision: 299
    scale: 1
    series: jammy
  identity-platform-login-ui-operator:
    charm: identity-platform-login-ui-operator
    revision: 203
    resources:
      oci-image: 100
    channel: latest/edge
    scale: 1
    series: jammy
    trust: true
  postgresql-k8s:
    charm: postgresql-k8s
    channel: 14/stable
    revision: 774
    resources:
      postgresql-image: 184
    series: jammy
    scale: 1
    trust: true
    options:
      plugin_pg_trgm_enable: true
      plugin_btree_gin_enable: true
  self-signed-certificates:
    charm: self-signed-certificates
    revision: 264
    channel: latest/stable
    scale: 1
  traefik-admin:
    charm: traefik-k8s
    channel: latest/stable
    revision: 298
    resources:
      traefik-image: 162
    series: focal
    scale: 1
    trust: true
    options:
      external_hostname: traefik-admin.localhost
  traefik-public:
    charm: traefik-k8s
    channel: latest/stable
    revision: 298
    resources:
      traefik-image: 162
    series: focal
    scale: 1
    trust: true
    options:
      external_hostname: traefik-public.localhost
relations:
  - [hydra:pg-database, postgresql-k8s:database]
  - [kratos:pg-database, postgresql-k8s:database]
  - [kratos-external-idp-integrator:kratos-external-idp, kratos:kratos-external-idp]
  - [hydra:internal-route, traefik-admin:traefik-route]
  - [hydra:public-route, traefik-public:traefik-route]
  - [kratos:internal-route, traefik-admin:traefik-route]
  - [kratos:public-route, traefik-public:traefik-route]
  - [identity-platform-login-ui-operator:public-route, traefik-public:traefik-route]
